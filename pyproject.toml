[project]
name = "docbot"
version = "1.0.0"
description = "Offline retrieval-augmented document Q&A chatbot (Ollama + Streamlit)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
